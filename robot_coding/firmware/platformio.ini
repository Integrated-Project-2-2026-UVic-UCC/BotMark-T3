; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32 @ ^6.7.0
board = esp32dev
framework = arduino
upload_port = /dev/esp32
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	madhephaestus/ESP32Encoder@^0.12.0
	hideakitai/MPU9250@^0.4.8
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git
	madhephaestus/ESP32Servo@^3.2.1
build_flags = 
	-D ZENOH_COMPILER_GCC
	-D ZENOH_ARDUINO_ESP32
	-D ZP_PLATFORM=arduino_esp32
	-D ZP_NET=bsd
	
	-D Z_FEATURE_SUBSCRIPTION=1
	-D CORE_DEBUG_LEVEL=0
